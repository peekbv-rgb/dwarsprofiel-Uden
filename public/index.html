<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vergelijking Kas 3 vs Kas 4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; text-align: center; }
.subtitle { font-size: 13px; color: #777; margin-bottom: 24px; text-align: center; }
.card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 1100px; margin-bottom: 16px; }
.status { font-size: 12px; color: #aaa; text-align: right; margin-bottom: 12px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; }
.tab { padding: 6px 18px; border: 1px solid #ccc; border-radius: 6px; background: transparent; color: #666; cursor: pointer; font-size: 13px; }
.tab.on { background: #2d7d46; color: #fff; border-color: #2d7d46; font-weight: 500; }
.nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.navbtn { width: 32px; height: 32px; border: 1px solid #ccc; border-radius: 6px; background: transparent; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.navbtn:hover:not(:disabled) { background: #f0f0f0; }
.navbtn:disabled { opacity: 0.3; cursor: default; }
.daytitle { font-size: 16px; font-weight: 600; min-width: 130px; text-align: center; }
.pair-block { margin-bottom: 36px; }
.pair-block:last-child { margin-bottom: 0; }
.pair-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #333; }
.pair-sub { font-size: 12px; color: #888; margin-bottom: 10px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; align-items: center; }
.li { display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 4px; }
.li.kas3 { background: #fdecea; color: #b71c1c; }
.li.kas4 { background: #e8f5e9; color: #1b5e20; }
.sw { width: 28px; height: 10px; display: inline-block; flex-shrink: 0; }
.chart-wrap { position: relative; width: 100%; height: 420px; }
.dots { text-align: center; font-size: 12px; color: #bbb; margin-top: 10px; letter-spacing: 3px; }
.loading { text-align: center; padding: 60px; color: #888; font-size: 14px; }
.error { text-align: center; padding: 40px; color: #c0392b; font-size: 14px; background: #fdf0f0; border-radius: 8px; }
.refresh-btn { padding: 5px 12px; border: 1px solid #ccc; border-radius: 6px; background: transparent; color: #555; cursor: pointer; font-size: 12px; margin-left: 8px; }
.refresh-btn:hover { background: #f5f5f5; }
.section-title { font-size: 18px; font-weight: 700; margin: 8px 0 18px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; }
.vd-headline { background: linear-gradient(135deg, #e8f5e9 0%, #fff 100%); border-left: 5px solid #2E7D32; padding: 18px 22px; border-radius: 8px; margin: 16px 0 24px; }
.vd-headline.neg { background: linear-gradient(135deg, #fdecea 0%, #fff 100%); border-left-color: #D32F2F; }
.vd-headline-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 6px; }
.vd-headline-big { font-size: 32px; font-weight: 700; line-height: 1.1; }
.vd-headline-big.pos { color: #1b5e20; }
.vd-headline-big.neg { color: #b71c1c; }
.vd-headline-sub { font-size: 13px; color: #555; margin-top: 6px; }
.vd-headline-detail { font-size: 12px; color: #777; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd; }
.vd-pair-row { display: flex; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.vd-card { padding: 14px 18px; border-radius: 8px; flex: 1; min-width: 220px; }
.vd-card.kas3 { background: #fdecea; border: 1px solid #f5c6cb; }
.vd-card.kas4 { background: #e8f5e9; border: 1px solid #c8e6c9; }
.vd-card h3 { font-size: 14px; margin-bottom: 8px; }
.vd-card.kas3 h3 { color: #b71c1c; }
.vd-card.kas4 h3 { color: #1b5e20; }
.vd-big { font-size: 28px; font-weight: 700; line-height: 1; }
.vd-big.kas3 { color: #b71c1c; }
.vd-big.kas4 { color: #1b5e20; }
.vd-sub { font-size: 12px; color: #666; margin-top: 4px; }
.daily-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
.daily-table th, .daily-table td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #eee; }
.daily-table th { background: #f7f7f7; font-weight: 600; color: #555; text-align: center; }
.daily-table td:first-child { text-align: left; font-weight: 500; }
.daily-table .pct-kas3 { color: #b71c1c; font-weight: 600; }
.daily-table .pct-kas4 { color: #1b5e20; font-weight: 600; }
.daily-table .diff-pos { color: #1b5e20; font-weight: 600; }
.daily-table .diff-neg { color: #b71c1c; font-weight: 600; }
@media (max-width: 600px) {
  .nav { margin-left: 0; width: 100%; justify-content: center; }
  .controls { flex-direction: column; align-items: flex-start; }
  .chart-wrap { height: 320px; }
  .vd-headline-big { font-size: 26px; }
}
</style>
</head>
<body>

<h1>Vergelijking Kas 3 vs Kas 4</h1>
<p class="subtitle">Temperatuur, luchtvochtigheid &amp; vochtdeficiet — Kas 3 (rood) vs Kas 4 (groen)</p>

<div class="card">
  <div class="status" id="status">Laden...</div>
  <div id="app"><div class="loading">⏳ Data ophalen...</div></div>
</div>

<script>
const PAIRS = [
  { title: 'Paar 1: Laag (29 cm) — VDB45 (Kas 3) ↔ VDB37 (Kas 4)', subtitle: 'Vergelijking op 29 cm hoogte',
    sensors: [
      { id: 'VDB45', kas: 'Kas 3', height: 29, color: '#D32F2F', dash: [] },
      { id: 'VDB37', kas: 'Kas 4', height: 29, color: '#2E7D32', dash: [] } ] },
  { title: 'Paar 2: Midden (128 cm) — VDB39 (Kas 3) ↔ VDB36 (Kas 4)', subtitle: 'Vergelijking op 128 cm hoogte',
    sensors: [
      { id: 'VDB39', kas: 'Kas 3', height: 128, color: '#D32F2F', dash: [] },
      { id: 'VDB36', kas: 'Kas 4', height: 128, color: '#2E7D32', dash: [] } ] },
  { title: 'Apart: VDB14 (Kas 4, 184 cm)', subtitle: 'Hoogste sensor — alleen Kas 4',
    sensors: [ { id: 'VDB14', kas: 'Kas 4', height: 184, color: '#2E7D32', dash: [] } ] },
  { title: 'Overzicht: Alle sensoren samen', subtitle: 'Kas 3 in roodtinten, Kas 4 in groentinten',
    sensors: [
      { id: 'VDB45', kas: 'Kas 3', height: 29,  color: '#EF5350', dash: [] },
      { id: 'VDB39', kas: 'Kas 3', height: 128, color: '#B71C1C', dash: [6,3] },
      { id: 'VDB37', kas: 'Kas 4', height: 29,  color: '#66BB6A', dash: [] },
      { id: 'VDB36', kas: 'Kas 4', height: 128, color: '#1B5E20', dash: [6,3] },
      { id: 'VDB14', kas: 'Kas 4', height: 184, color: '#004D40', dash: [2,3] } ] }
];

const VD_THRESHOLD = 10;
const VD_PERIOD_DAYS = 7;

let DATA = null, DAYS = [], dayIdx = 0, mode = 'temp', charts = [];

function fmtDay(d) {
  if (!d) return '';
  const p = d.split('-');
  const mn = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][+p[1]-1];
  return p[2] + ' ' + mn + ' ' + p[0];
}
function fmtDayShort(d) {
  if (!d) return '';
  const p = d.split('-');
  const mn = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][+p[1]-1];
  return p[2] + ' ' + mn;
}
function mkLabel(h) {
  const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
  return hr.toString().padStart(2,'0') + ':' + mn.toString().padStart(2,'0');
}
function interpolate(pts, x) {
  if (!pts || pts.length === 0) return null;
  if (x <= pts[0].x) return pts[0].y;
  if (x >= pts[pts.length-1].x) return pts[pts.length-1].y;
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].x >= x) {
      const a = pts[i-1], b = pts[i];
      const t = (x - a.x) / (b.x - a.x);
      return a.y + t * (b.y - a.y);
    }
  }
  return null;
}
function vd_gm3(T, RH) {
  if (T == null || RH == null || isNaN(T) || isNaN(RH)) return null;
  const es_kPa = 0.6108 * Math.exp(17.27 * T / (T + 237.3));
  const ea_kPa = es_kPa * RH / 100;
  const ah_sat = 216.7 * es_kPa * 10 / (T + 273.15);
  const ah_act = 216.7 * ea_kPa * 10 / (T + 273.15);
  return ah_sat - ah_act;
}
function legendSwatch(color, dash) {
  const dashAttr = dash && dash.length ? ` stroke-dasharray="${dash.join(' ')}"` : '';
  return `<svg class="sw" viewBox="0 0 28 10" preserveAspectRatio="none">
    <line x1="0" y1="5" x2="28" y2="5" stroke="${color}" stroke-width="2.5"${dashAttr} stroke-linecap="round"/></svg>`;
}
function mkDatasets(pair, day, m) {
  return pair.sensors.map(s => {
    const d = DATA[day] && DATA[day][s.id];
    if (!d || !d.hrs.length) return { label: s.id, data: [], borderColor: s.color, borderWidth: 2, pointRadius: 0, _pts: [] };
    const pts = d.hrs.map((h, j) => ({ x: h, y: d[m][j] })).sort((a, b) => a.x - b.x);
    return { label: `${s.id} — ${s.kas} (${s.height} cm)`, data: pts, _pts: pts,
      borderColor: s.color, backgroundColor: s.color + '20', borderWidth: 2,
      borderDash: s.dash || [], pointRadius: 0, tension: 0.2, spanGaps: false, fill: false };
  });
}

function timeBelowThreshold(sensorId, days) {
  let total = 0, below = 0;
  for (const day of days) {
    const d = DATA[day] && DATA[day][sensorId];
    if (!d || !d.hrs.length) continue;
    const idx = d.hrs.map((_, i) => i).sort((a, b) => d.hrs[a] - d.hrs[b]);
    for (let k = 0; k < idx.length; k++) {
      const i = idx[k];
      const T = d.temp[i], RH = d.hum[i];
      const vd = vd_gm3(T, RH);
      if (vd == null) continue;
      let weight = 1;
      if (k < idx.length - 1) {
        const j = idx[k+1];
        weight = Math.max(0.001, d.hrs[j] - d.hrs[i]);
      } else if (idx.length > 1) {
        const j = idx[k-1];
        weight = Math.max(0.001, d.hrs[i] - d.hrs[j]);
      }
      total += weight;
      if (vd < VD_THRESHOLD) below += weight;
    }
  }
  return { totalHours: total, belowHours: below, pct: total > 0 ? (below/total)*100 : null };
}

function fmtHours(h) {
  if (h == null) return '–';
  if (h < 1) return (h * 60).toFixed(0) + ' min';
  return h.toFixed(1) + ' uur';
}

function buildVDSection() {
  const vdPairs = [
    { name: 'Laag (29 cm)',    k3: 'VDB45', k4: 'VDB37' },
    { name: 'Midden (128 cm)', k3: 'VDB39', k4: 'VDB36' }
  ];

  const allDaysSorted = [...DAYS].sort();
  const periodDays = allDaysSorted.slice(-VD_PERIOD_DAYS);
  const nDays = periodDays.length;
  const fromDay = periodDays[0];
  const toDay = periodDays[periodDays.length - 1];

  let html = `<div class="section-title">Vochtdeficiet (VD) analyse — % van de tijd onder VD = ${VD_THRESHOLD} g/m³</div>`;
  html += `<div style="font-size:12px;color:#777;margin-bottom:14px">
    Analyse over de <strong>laatste ${nDays} dagen</strong> (${fmtDayShort(fromDay)} t/m ${fmtDayShort(toDay)}).
    VD berekend uit temperatuur en luchtvochtigheid (Magnus-formule). Een lage VD betekent vochtige lucht.</div>`;

  const midK3 = timeBelowThreshold('VDB39', periodDays);
  const midK4 = timeBelowThreshold('VDB36', periodDays);
  const hourDiff = (midK3.belowHours != null && midK4.belowHours != null)
    ? midK4.belowHours - midK3.belowHours : null;
  const isPos = hourDiff != null && hourDiff > 0;
  const isNeg = hourDiff != null && hourDiff < 0;

  if (hourDiff != null) {
    const absH = Math.abs(hourDiff);
    const perDay = absH / nDays;
    html += `<div class="vd-headline ${isNeg ? 'neg' : ''}">
      <div class="vd-headline-label">Midden-sensor (128 cm) — over ${nDays} dagen</div>
      <div class="vd-headline-big ${isPos ? 'pos' : (isNeg ? 'neg' : '')}">
        ${isPos ? 'Kas 4 zit ' + fmtHours(absH) + ' langer onder VD ' + VD_THRESHOLD + ' dan Kas 3'
          : (isNeg ? 'Kas 3 zit ' + fmtHours(absH) + ' langer onder VD ' + VD_THRESHOLD + ' dan Kas 4'
          : 'Beide kassen even lang onder VD ' + VD_THRESHOLD)}
      </div>
      <div class="vd-headline-sub">
        Gemiddeld <strong>${fmtHours(perDay)}/dag</strong> ${isPos ? 'meer in Kas 4' : (isNeg ? 'meer in Kas 3' : '')}
      </div>
      <div class="vd-headline-detail">
        Kas 3 (VDB39): <strong>${fmtHours(midK3.belowHours)}</strong> onder VD ${VD_THRESHOLD} van totaal ${fmtHours(midK3.totalHours)} (${midK3.pct.toFixed(1)}%)<br>
        Kas 4 (VDB36): <strong>${fmtHours(midK4.belowHours)}</strong> onder VD ${VD_THRESHOLD} van totaal ${fmtHours(midK4.totalHours)} (${midK4.pct.toFixed(1)}%)
      </div>
    </div>`;
  }

  html += `<div style="font-size:14px;font-weight:600;margin-bottom:10px">Beide hoogtes — totaal over ${nDays} dagen</div>`;
  for (const vp of vdPairs) {
    const r3 = timeBelowThreshold(vp.k3, periodDays);
    const r4 = timeBelowThreshold(vp.k4, periodDays);
    const dPct = (r4.pct != null && r3.pct != null) ? (r4.pct - r3.pct) : null;
    const dHrs = (r4.belowHours != null && r3.belowHours != null) ? (r4.belowHours - r3.belowHours) : null;
    html += `<div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:500;margin-bottom:6px;color:#555">${vp.name}</div>
      <div class="vd-pair-row">
        <div class="vd-card kas3">
          <h3>Kas 3 — ${vp.k3}</h3>
          <div class="vd-big kas3">${r3.pct != null ? r3.pct.toFixed(1) : '–'}%</div>
          <div class="vd-sub">${fmtHours(r3.belowHours)} onder VD ${VD_THRESHOLD}</div>
        </div>
        <div class="vd-card kas4">
          <h3>Kas 4 — ${vp.k4}</h3>
          <div class="vd-big kas4">${r4.pct != null ? r4.pct.toFixed(1) : '–'}%</div>
          <div class="vd-sub">${fmtHours(r4.belowHours)} onder VD ${VD_THRESHOLD}</div>
        </div>
      </div>
      ${dPct != null ? `<div style="font-size:13px;color:#555">
        Verschil: <strong style="color:${dPct > 0 ? '#1b5e20' : (dPct < 0 ? '#b71c1c' : '#555')}">${dPct > 0 ? '+' : ''}${dPct.toFixed(1)} pp (${dHrs > 0 ? '+' : ''}${fmtHours(Math.abs(dHrs))})</strong>
        ${dPct > 0 ? '— Kas 4 vaker vochtig' : (dPct < 0 ? '— Kas 3 vaker vochtig' : '')}
      </div>` : ''}
    </div>`;
  }

  html += `<div style="font-size:14px;font-weight:600;margin:20px 0 8px">Per dag uitgesplitst (midden — 128 cm)</div>`;
  html += `<div style="overflow-x:auto"><table class="daily-table">
    <thead><tr>
      <th>Datum</th>
      <th>Kas 3<br>(VDB39)</th>
      <th>Kas 4<br>(VDB36)</th>
      <th>Δ %<br>(procentpunten)</th>
      <th>Uren Kas 3<br>onder VD ${VD_THRESHOLD}</th>
      <th>Uren Kas 4<br>onder VD ${VD_THRESHOLD}</th>
      <th>Δ uur<br>(Kas 4 − Kas 3)</th>
    </tr></thead><tbody>`;

  const sortedDays = [...periodDays].sort().reverse();
  for (const day of sortedDays) {
    const r3 = timeBelowThreshold('VDB39', [day]);
    const r4 = timeBelowThreshold('VDB36', [day]);
    const dPct = (r3.pct != null && r4.pct != null) ? (r4.pct - r3.pct) : null;
    const dHrs = (r3.belowHours != null && r4.belowHours != null) ? (r4.belowHours - r3.belowHours) : null;
    html += `<tr>
      <td>${fmtDayShort(day)}</td>
      <td class="pct-kas3">${r3.pct != null ? r3.pct.toFixed(0) + '%' : '–'}</td>
      <td class="pct-kas4">${r4.pct != null ? r4.pct.toFixed(0) + '%' : '–'}</td>
      <td class="${dPct > 0 ? 'diff-pos' : (dPct < 0 ? 'diff-neg' : '')}">${dPct != null ? (dPct > 0 ? '+' : '') + dPct.toFixed(0) + ' pp' : '–'}</td>
      <td>${r3.belowHours != null ? r3.belowHours.toFixed(1) + ' uur' : '–'}</td>
      <td>${r4.belowHours != null ? r4.belowHours.toFixed(1) + ' uur' : '–'}</td>
      <td class="${dHrs > 0 ? 'diff-pos' : (dHrs < 0 ? 'diff-neg' : '')}">${dHrs != null ? (dHrs > 0 ? '+' : '') + dHrs.toFixed(1) + ' uur' : '–'}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div style="font-size:11px;color:#999;margin-top:6px">pp = procentpunten · Positieve Δ betekent Kas 4 zit langer onder VD ${VD_THRESHOLD}</div>`;

  html += `<div style="font-size:14px;font-weight:600;margin:24px 0 8px">VD-diagram met huidige waarden</div>`;
  html += `<div style="font-size:12px;color:#777;margin-bottom:10px">Iso-VD lijnen tonen voor welke combinaties van temperatuur en RV welke VD-waarde geldt. De stippen zijn de meest recente metingen.</div>`;
  html += `<div class="chart-wrap" style="height:480px"><canvas id="vdChart"></canvas></div>`;

  return html;
}

function buildVDChart() {
  function rhForVDAndT(vd, T) {
    const es_kPa = 0.6108 * Math.exp(17.27 * T / (T + 237.3));
    const AH_sat = 216.7 * es_kPa * 10 / (T + 273.15);
    return 100 * (1 - vd / AH_sat);
  }
  const VD_COLORS = {
    0:'#3CB371',1:'#808080',2:'#FF1493',3:'#FFD700',4:'#FFA500',5:'#800080',6:'#8B0000',7:'#2F4F4F',
    8:'#0000FF',9:'#00CED1',10:'#9370DB',11:'#006400',12:'#FF0000',13:'#87CEEB',14:'#FFB6C1',15:'#DDA0DD',16:'#FFDAB9'
  };
  const datasets = [];
  for (let vd = 0; vd <= 16; vd++) {
    const pts = [];
    for (let T = 5; T <= 35; T += 0.5) {
      const rh = rhForVDAndT(vd, T);
      if (rh >= 0 && rh <= 100) pts.push({ x: T, y: rh });
    }
    if (pts.length > 1) {
      datasets.push({
        label: 'VD = ' + vd,
        data: pts,
        borderColor: VD_COLORS[vd] || '#888',
        backgroundColor: VD_COLORS[vd] || '#888',
        borderWidth: vd === VD_THRESHOLD ? 3 : 1.4,
        pointRadius: 0,
        pointHoverRadius: 0,
        tension: 0.3,
        fill: false,
        showLine: true,
        _isoline: true
      });
    }
  }
  const lastDay = DAYS[DAYS.length - 1];
  const sensorMarkers = [
    { id: 'VDB45', label: 'VDB45 (29 cm)',  color: '#D32F2F', shape: 'circle' },
    { id: 'VDB39', label: 'VDB39 (128 cm)', color: '#B71C1C', shape: 'triangle' },
    { id: 'VDB37', label: 'VDB37 (29 cm)',  color: '#2E7D32', shape: 'circle' },
    { id: 'VDB36', label: 'VDB36 (128 cm)', color: '#1B5E20', shape: 'triangle' },
    { id: 'VDB14', label: 'VDB14 (184 cm)', color: '#004D40', shape: 'rect' }
  ];
  for (const sm of sensorMarkers) {
    const d = DATA[lastDay] && DATA[lastDay][sm.id];
    if (!d || !d.hrs.length) continue;
    let latestIdx = 0;
    for (let i = 1; i < d.hrs.length; i++) if (d.hrs[i] > d.hrs[latestIdx]) latestIdx = i;
    const T = d.temp[latestIdx], RH = d.hum[latestIdx];
    datasets.push({
      label: sm.label + ' (laatste meting)',
      data: [{ x: T, y: RH }],
      borderColor: sm.color,
      backgroundColor: sm.color,
      pointRadius: 8,
      pointHoverRadius: 10,
      pointStyle: sm.shape,
      showLine: false
    });
  }
  return new Chart(document.getElementById('vdChart'), {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {
        legend: { display: true, position: 'right', labels: { font: { size: 10 }, boxWidth: 14 } },
        tooltip: { callbacks: { label: ctx => {
          const T = ctx.parsed.x, RH = ctx.parsed.y;
          const vd = vd_gm3(T, RH);
          return `${ctx.dataset.label}: T=${T.toFixed(1)}°C, RV=${RH.toFixed(0)}%${vd != null ? ', VD=' + vd.toFixed(1) + ' g/m³' : ''}`;
        }}}
      },
      scales: {
        x: { type: 'linear', min: 5, max: 35, title: { display: true, text: 'Temperatuur (°C)', color: '#555' }, ticks: { stepSize: 1, color: '#888' }, grid: { color: 'rgba(0,0,0,0.08)' } },
        y: { type: 'linear', min: 0, max: 100, title: { display: true, text: 'Relatieve vochtigheid (%)', color: '#555' }, ticks: { stepSize: 10, color: '#888' }, grid: { color: 'rgba(0,0,0,0.08)' } }
      }
    }
  });
}

function render() {
  const day = DAYS[dayIdx];
  document.getElementById('dtitle').textContent = fmtDay(day);
  document.getElementById('prev').disabled = dayIdx === 0;
  document.getElementById('next').disabled = dayIdx === DAYS.length - 1;
  document.getElementById('dots').textContent = DAYS.map((_, i) => i === dayIdx ? '●' : '·').join(' ');
  charts.forEach((chart, i) => {
    if (!PAIRS[i]) return;
    chart.data.datasets = mkDatasets(PAIRS[i], day, mode);
    chart.options.scales.y.title.text = mode === 'temp' ? 'Temperatuur (°C)' : 'Luchtvochtigheid (%)';
    chart.update('none');
  });
}
function go(d) { dayIdx = Math.max(0, Math.min(DAYS.length - 1, dayIdx + d)); render(); }
function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function buildUI() {
  const pairBlocks = PAIRS.map((p, i) => `
    <div class="pair-block">
      <div class="pair-title">${p.title}</div>
      <div class="pair-sub">${p.subtitle}</div>
      <div class="legend">
        ${p.sensors.map(s => `<span class="li ${s.kas === 'Kas 3' ? 'kas3' : 'kas4'}">${legendSwatch(s.color, s.dash)}<strong>${s.kas}</strong> — ${s.id} (${s.height} cm)</span>`).join('')}
      </div>
      <div class="chart-wrap"><canvas id="chart${i}"></canvas></div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="controls">
      <div class="tabs">
        <button class="tab on" onclick="setMode('temp',this)">Temperatuur (°C)</button>
        <button class="tab" onclick="setMode('hum',this)">Luchtvochtigheid (%)</button>
      </div>
      <div class="nav">
        <button class="navbtn" id="prev" onclick="go(-1)">&#8249;</button>
        <span class="daytitle" id="dtitle"></span>
        <button class="navbtn" id="next" onclick="go(1)">&#8250;</button>
      </div>
    </div>
    ${pairBlocks}
    <div class="dots" id="dots"></div>
    <hr style="margin:30px 0;border:none;border-top:1px solid #eee">
    ${buildVDSection()}`;

  charts = PAIRS.map((p, i) => new Chart(document.getElementById('chart' + i), {
    type: 'line',
    data: { datasets: mkDatasets(p, DAYS[dayIdx], 'temp') },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true, mode: 'nearest', axis: 'x', intersect: false,
          callbacks: {
            title: items => items.length ? '🕐 ' + mkLabel(items[0].parsed.x) : '',
            beforeBody: items => {
              if (!items.length) return [];
              const chart = items[0].chart, x = items[0].parsed.x, lines = [];
              chart.data.datasets.forEach(ds => {
                const y = interpolate(ds._pts, x);
                if (y !== null) lines.push(ds.label + ': ' + y.toFixed(1) + (mode === 'temp' ? ' °C' : ' %'));
              });
              return lines;
            },
            label: () => ''
          }
        }
      },
      scales: {
        x: { type: 'linear', min: 0, max: 24, ticks: { stepSize: 2, callback: v => v + 'u', color: '#888' }, grid: { color: 'rgba(0,0,0,0.06)' }, title: { display: true, text: 'Tijd van de dag', color: '#888', font: { size: 11 } } },
        y: { beginAtZero: false, grace: '5%', ticks: { color: '#888' }, grid: { color: 'rgba(0,0,0,0.06)' }, title: { display: true, text: 'Temperatuur (°C)', color: '#888', font: { size: 12 } } }
      }
    }
  }));

  buildVDChart();

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  render();
}

async function loadData() {
  try {
    const res = await fetch('/api/data');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    DATA = json.data;
    DAYS = Object.keys(DATA).sort();
    if (DAYS.length === 0) {
      document.getElementById('app').innerHTML = `<div class="error">⚠️ Geen data gevonden voor de afgelopen 14 dagen.<br><button class="refresh-btn" onclick="loadData()" style="font-size:14px;padding:8px 16px">Opnieuw proberen</button></div>`;
      document.getElementById('status').textContent = 'Geen recente data';
      return;
    }
    dayIdx = Math.max(0, DAYS.length - 2);
    const fetched = new Date(json.fetched);
    document.getElementById('status').innerHTML = `Laatste update: ${fetched.toLocaleString('nl-NL')} &nbsp;<button class="refresh-btn" onclick="loadData()">↻ Vernieuwen</button>`;
    buildUI();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="error">❌ ${err.message}<br><br><button class="refresh-btn" onclick="loadData()" style="font-size:14px;padding:8px 16px">Opnieuw proberen</button></div>`;
    document.getElementById('status').textContent = 'Laden mislukt';
  }
}

loadData();
</script>
</body>
</html>
